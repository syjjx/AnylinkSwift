name: Build & Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v1.1）。留空则只上传构建产物，不发布 GitHub Release'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build DMG (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout AnyLinkSwift
        uses: actions/checkout@v6

      - name: Checkout sslcon
        uses: actions/checkout@v6
        with:
          repository: syjjx/sslcon
          path: sslcon

      - name: Set up Go (for embedded vpnagent/sslcon)
        uses: actions/setup-go@v6
        with:
          go-version-file: sslcon/go.mod

      - name: Show toolchain
        run: |
          xcodebuild -version
          go version

      - name: Build Release app (unsigned)
        env:
          SSLCON_REPO: ${{ github.workspace }}/sslcon
          GO_BIN: go
        run: |
          cd TunnelPilot
          xcodebuild -project TunnelPilot.xcodeproj \
            -scheme TunnelPilot \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "${{ runner.temp }}/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign app (避免 Gatekeeper 判为“已损坏”)
        run: |
          APP="${{ runner.temp }}/build/Build/Products/Release/TunnelPilot.app"
          # Xcode 26 的 ld 即使 CODE_SIGNING_ALLOWED=NO 也会给主二进制嵌入
          # linker-signed ad-hoc 签名，但 bundle 没有正式签名（无 _CodeSignature），
          # 签名与内容不一致 → Gatekeeper 报“已损坏”且没有“仍要打开”。
          # 这里对 bundle 整体做 ad-hoc 签名，让签名完整一致 → 变为“未信任但可打开”。
          codesign --force --sign - "$APP/Contents/MacOS/vpnagent"
          codesign --force --sign - "$APP/Contents/MacOS/sslcon"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP" || { echo "签名校验失败" >&2; exit 1; }

      - name: Create DMG
        run: |
          APP="${{ runner.temp }}/build/Build/Products/Release/TunnelPilot.app"
          test -d "$APP" || { echo "未找到构建产物 $APP" >&2; exit 1; }
          STAGING="${{ runner.temp }}/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "隧道助手 安全客户端" \
            -srcfolder "$STAGING" \
            -ov -format UDZO "${{ runner.temp }}/TunnelPilot.dmg"
          cp "${{ runner.temp }}/TunnelPilot.dmg" TunnelPilot.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunnelPilot-DMG
          path: TunnelPilot.dmg
          if-no-files-found: error

      - name: Publish GitHub Release (if version given)
        if: github.event.inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: TunnelPilot.dmg
          generate_release_notes: true
